services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crux-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: crux-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crux -d crux"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: crux
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crux
    ports:
      - "5432:5432"
    volumes:
      - crux-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: crux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - crux-redis:/data
      

volumes:
  crux-redis:
  crux-postgres: